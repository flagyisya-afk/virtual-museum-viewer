<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papyrus Info Viewer</title>

  <!-- Custom Font -->
  <style>
    @font-face {
      font-family: "TamaConnect";
      src: url("tamaconnecttype.ttf") format("truetype");
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "TamaConnect", sans-serif;
      background: #000000;
      color: #ffffff;
    }

    #infoBox {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 16px 20px;
      border-radius: 10px;
      max-width: 320px;
      text-align: center;
      display: none;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    #infoBox h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    #infoBox p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }

    #hint {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 20;
    }

    #status {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 20;
    }

    #backLink {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 20;
    }

    #backLink:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <a id="backLink" href="../index.html">Back to Main Menu</a>
  <div id="hint">Drag to rotate • Scroll to zoom • Click on details</div>
  <div id="status">Loading model...</div>

  <div id="infoBox">
    <h3 id="infoTitle"></h3>
    <p id="infoText"></p>
  </div>

  <script type="module">

// Import Three.js from CDN
import * as THREE from "https://unpkg.com/three@0.158.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js";

// ---------------------------
// Info Database
// ---------------------------

const infoData = {
  "Object_4": {
    title: "Papyrus Fragment",
    text: "A Byzantine-medieval papyrus surface with visible fiber texture and age wear."
  },
  "Object_0": {
    title: "Papyrus Fragment",
    text: "A Byzantine-medieval papyrus surface with visible fiber texture and age wear."
  }
};

// ---------------------------
// Scene Setup
// ---------------------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f14);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 2, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------------------------
// Info Box Elements
// ---------------------------

const infoBox = document.getElementById("infoBox");
const infoTitle = document.getElementById("infoTitle");
const infoText = document.getElementById("infoText");
const status = document.getElementById("status");

function showInfo(title, text) {
  infoTitle.textContent = title;
  infoText.textContent = text;
  infoBox.style.display = "block";
}

function hideInfo() {
  infoBox.style.display = "none";
}

// ---------------------------
// Controls
// ---------------------------

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ---------------------------
// Lights
// ---------------------------

scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);

// ---------------------------
// Model Loader
// ---------------------------

const loader = new GLTFLoader();

const MODEL_PATHS = ["../byzantine-medieval_papyrus.glb", "model.gltf"];

let model;
const clickableObjects = [];

function loadModelAt(index) {
  if (index >= MODEL_PATHS.length) {
    status.textContent = "Model failed to load";
    return;
  }

  const modelPath = MODEL_PATHS[index];

  loader.load(
    modelPath,
    (gltf) => {
      model = gltf.scene;

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);

      scene.add(model);

      model.traverse((child) => {
        if (child.isMesh) {
          clickableObjects.push(child);
        }
      });

      status.textContent = "Model ready";
      console.log("Model loaded from:", modelPath);
    },
    undefined,
    (error) => {
      console.warn("Load failed for", modelPath, error);
      loadModelAt(index + 1);
    }
  );
}

loadModelAt(0);

// ---------------------------
// Raycaster
// ---------------------------

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", (e) => {

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(clickableObjects, true);

  if (hits.length > 0) {

    const mesh = hits[0].object;
    const name = mesh.name;

    console.log("Clicked:", name);

    if (infoData[name]) {

      showInfo(
        infoData[name].title,
        infoData[name].text
      );

    } else {

      showInfo(
        "Unknown Part",
        "Mesh name: " + name
      );

    }

  } else {

    hideInfo();

  }

});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    hideInfo();
  }
});

// ---------------------------
// Resize
// ---------------------------

window.addEventListener("resize", () => {

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);

});

// ---------------------------
// Animate
// ---------------------------

function animate() {

  requestAnimationFrame(animate);

  controls.update();
  renderer.render(scene, camera);

}

animate();

</script>
</body>
</html>
