<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Controller</title>
<style>
html, body {
  margin:0;
  height:100%;
  background:black;
  touch-action:none;
}
</style>
</head>

<body>

<script>
const channel = new BroadcastChannel("hologram-control");

function sendRotation(x, y) {
  channel.postMessage({ rotX: x, rotY: y });
}

document.addEventListener("touchmove", e => {
  const t = e.touches[0];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  const rotX = (t.clientY - cy) * 0.002;
  const rotY = (t.clientX - cx) * 0.002;

  sendRotation(rotX, rotY);
});

document.addEventListener("mousemove", e => {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  const rotX = (e.clientY - cy) * 0.002;
  const rotY = (e.clientX - cx) * 0.002;

  sendRotation(rotX, rotY);
});
</script>

</body>
</html>
