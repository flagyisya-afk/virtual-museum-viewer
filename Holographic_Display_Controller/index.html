<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>Holographic Display Controller</title>

<!-- ⬇️ YOUR ORIGINAL STYLES (UNCHANGED) -->
<style>
/* === SAME CSS AS YOUR OG VIEWER — UNTOUCHED === */
:root{
  --bg:#0b0c0f;
  --ui-bg: rgba(255,255,255,0.06);
  --accent: #d7c49e;
  --muted: rgba(255,255,255,0.6);
  --glass: rgba(255,255,255,0.04);
  --radius:12px;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
}
html,body{height:100%;margin:0;background:#050607;color:#fff;overflow:hidden}
#app{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
.ui{position:absolute;right:18px;top:18px;width:320px;background:var(--ui-bg);padding:12px;border-radius:12px;backdrop-filter:blur(6px)}
label{font-size:12px;color:var(--muted)}
button{padding:8px 10px;border-radius:10px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.1)}
button.primary{background:var(--accent);color:#111;border:0}
.controls{display:flex;gap:6px;flex-wrap:wrap}
input[type=range]{width:100%}
</style>
</head>

<body>
<div id="app">
  <canvas id="c"></canvas>

  <!-- UI (UNCHANGED STRUCTURE) -->
  <div class="ui">
    <h1>Artifact Controller</h1>

    <label>Lighting Preset</label>
    <div class="controls">
      <button id="presetMuseum">Museum</button>
      <button id="presetStudio">Studio</button>
      <button id="presetWarm">Warm</button>
    </div>

    <label style="margin-top:10px">Scale</label>
    <input id="scaleRange" type="range" min="0.3" max="3" step="0.01" value="1">
  </div>
</div>

<script type="module">
/* =======================
   BROADCAST SETUP
======================= */
const CHANNEL = "pandoras-hologram";
const channel = "BroadcastChannel" in window ? new BroadcastChannel(CHANNEL) : null;

const sharedState = {
  rotX: 0,
  rotY: 0,
  scale: 1,
  preset: "museum"
};

function publish() {
  channel?.postMessage(sharedState);
  localStorage.setItem("pandoras-hologram", JSON.stringify(sharedState));
}

/* =======================
   THREE SETUP (OG STYLE)
======================= */
import * as THREE from "https://esm.sh/three@0.154.0";
import { OrbitControls } from "https://esm.sh/three@0.154.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://esm.sh/three@0.154.0/examples/jsm/loaders/GLTFLoader.js";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.01, 100);
camera.position.set(0,0.6,1.6);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

const lights = {
  key: new THREE.DirectionalLight(0xffffff,1),
  fill: new THREE.HemisphereLight(0xffffff,0x444444,0.4),
  rim: new THREE.DirectionalLight(0xffffff,0.4)
};
lights.key.position.set(0.6,1.4,1);
scene.add(lights.key, lights.fill, lights.rim);

const modelGroup = new THREE.Group();
scene.add(modelGroup);

const loader = new GLTFLoader();
let model;

loader.load("/the_map_of_the_world_tablet.glb", gltf=>{
  model = gltf.scene;
  model.traverse(m=>m.isMesh&&(m.castShadow=true));
  modelGroup.add(model);
});

/* =======================
   PRESETS
======================= */
const presets = {
  museum(){ lights.key.intensity=1; },
  studio(){ lights.key.intensity=1.8; },
  warm(){ lights.key.intensity=1; lights.key.color.set(0xfff1dc); }
};

presetMuseum.onclick=()=>{presets.museum();sharedState.preset="museum";publish();}
presetStudio.onclick=()=>{presets.studio();sharedState.preset="studio";publish();}
presetWarm.onclick=()=>{presets.warm();sharedState.preset="warm";publish();}

scaleRange.oninput=e=>{
  sharedState.scale=parseFloat(e.target.value);
  if(model) model.scale.setScalar(sharedState.scale);
  publish();
};

controls.addEventListener("change",()=>{
  sharedState.rotX=modelGroup.rotation.x;
  sharedState.rotY=modelGroup.rotation.y;
  publish();
});

/* =======================
   LOOP
======================= */
function animate(){
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
