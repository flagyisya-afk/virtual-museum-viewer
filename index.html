<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pandora's Safe — Virtual Museum</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --shell: #d6c8f0;
    --shell-dark: #a78dc9;
    --screen-bg: #9bbc0f;
    --screen-dark: #0f380f;
    --btn: #e84393;
    --btn-hover: #fd79a8;
    --pixel-font: 'Press Start 2P', monospace;
  }

  html, body {
    height: 100%;
    font-family: var(--pixel-font);
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }

  /* ── Tamagotchi shell ── */
  .tama-shell {
    position: relative;
    width: 380px;
    max-width: 95vw;
    background: var(--shell);
    border-radius: 48px 48px 140px 140px;
    padding: 28px 24px 50px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.4),
      0 12px 40px rgba(0,0,0,0.6),
      0 0 0 6px var(--shell-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* little decorative screws */
  .tama-shell::before,
  .tama-shell::after {
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #bbb 30%, #888 100%);
    top: 16px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
  }
  .tama-shell::before { left: 24px; }
  .tama-shell::after  { right: 24px; }

  /* ── Title ── */
  .title-area {
    text-align: center;
    color: #4a3a6b;
  }
  .title-area h1 {
    font-size: 11px;
    letter-spacing: 1px;
    line-height: 1.6;
  }
  .title-area .subtitle {
    font-size: 7px;
    color: #7a6a9b;
    margin-top: 4px;
  }

  /* ── Screen ── */
  .screen {
    width: 100%;
    background: var(--screen-bg);
    border: 4px solid #3a3a3a;
    border-radius: 12px;
    padding: 16px 12px;
    box-shadow:
      inset 0 4px 12px rgba(0,0,0,0.25),
      0 2px 0 rgba(255,255,255,0.2);
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    image-rendering: pixelated;
  }

  .screen-title {
    font-size: 8px;
    color: var(--screen-dark);
    text-align: center;
    padding-bottom: 6px;
    border-bottom: 2px dashed rgba(15,56,15,0.3);
    width: 100%;
  }

  /* ── Menu buttons (inside screen) ── */
  .menu-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }

  .menu-btn {
    display: block;
    width: 100%;
    padding: 10px 8px;
    font-family: var(--pixel-font);
    font-size: 7px;
    text-align: center;
    color: var(--screen-dark);
    background: rgba(15, 56, 15, 0.08);
    border: 2px solid var(--screen-dark);
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, transform 0.1s;
    line-height: 1.5;
  }
  .menu-btn:hover {
    background: rgba(15, 56, 15, 0.22);
    transform: scale(1.03);
  }
  .menu-btn:active {
    transform: scale(0.97);
  }

  /* little pixel arrow indicator */
  .menu-btn::before {
    content: '▶ ';
  }

  /* ── Physical buttons below screen ── */
  .hw-buttons {
    display: flex;
    gap: 20px;
    margin-top: 4px;
  }

  .hw-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    cursor: default;
    box-shadow: 0 3px 0 rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .hw-btn.a { background: var(--btn); }
  .hw-btn.b { background: #fdcb6e; }
  .hw-btn.c { background: #55efc4; }

  /* ── Footer branding ── */
  .brand {
    font-size: 6px;
    color: #9a8abf;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── Tiny bouncing mascot on screen ── */
  .mascot {
    font-size: 28px;
    animation: bounce 1.2s ease-in-out infinite;
    filter: drop-shadow(0 2px 0 rgba(15,56,15,0.3));
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* Responsiveness */
  @media (max-width: 420px) {
    .tama-shell {
      border-radius: 32px 32px 100px 100px;
      padding: 20px 14px 40px;
    }
    .menu-btn { font-size: 6px; padding: 8px 6px; }
  }
</style>
</head>
<body>

<div class="tama-shell">

  <div class="title-area">
    <h1>PANDORA'S SAFE</h1>
    <div class="subtitle">~ Virtual Museum ~</div>
  </div>

  <div class="screen">
    <div class="mascot">🏛️</div>
    <div class="screen-title">SELECT AN EXHIBIT</div>

    <div class="menu-list">
      <a class="menu-btn" href="Museum_Artifact_Viewer/">Museum Artifact Viewer</a>
      <a class="menu-btn" href="Holographic_Display/">Holographic Display</a>
      <a class="menu-btn" href="Holographic_Display_s/">Holographic Display S</a>
      <a class="menu-btn" href="Holographic_Display_Controller/">Holographic Controller</a>
      <a class="menu-btn" href="Cubic_DIsplay_System/">Cubic Display System</a>
      <a class="menu-btn" href="Projection_Mapping_HandTracking/">Projection Mapping</a>
      <a class="menu-btn" href="Meggy's_game/">Meggy's Game</a>
    </div>
  </div>

  <div class="hw-buttons">
    <button class="hw-btn a" aria-label="A button"></button>
    <button class="hw-btn b" aria-label="B button"></button>
    <button class="hw-btn c" aria-label="C button"></button>
  </div>

  <div class="brand">pandorassafe.org</div>

</div>

</body>
</html>
