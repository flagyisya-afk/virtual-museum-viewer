<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Holographic Artifact Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
@font-face {
  font-family: "TamaConnect";
  src: url("../Menu/tamaconnecttype.ttf") format("truetype");
}

html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
  width: 100%;
  height: 100%;
}

.position {
  position: absolute;
  width: 45vmin;
  height: 45vmin;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.pos-top {
  top: 0;
  left: 50%;
  transform: translateX(-50%);
}

.pos-bottom {
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) rotate(180deg);
}

.pos-left {
  left: 0;
  top: 50%;
  transform: translateY(-50%) rotate(90deg);
}

.pos-right {
  right: 0;
  top: 50%;
  transform: translateY(-50%) rotate(-90deg);
}

#backLink {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 100;
  background: rgba(0, 0, 0, 0.65);
  color: #fff;
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  font-family: "TamaConnect", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  font-size: 13px;
}

#backLink:hover {
  background: rgba(255, 255, 255, 0.15);
}

</style>
</head>

<body>

<a id="backLink" href="../index.html">&larr; Back</a>

<div class="position pos-top"><canvas id="view-top"></canvas></div>
<div class="position pos-bottom"><canvas id="view-bottom"></canvas></div>
<div class="position pos-left"><canvas id="view-left"></canvas></div>
<div class="position pos-right"><canvas id="view-right"></canvas></div>

<script type="module">
import * as THREE from "https://esm.sh/three@0.154.0";
import { GLTFLoader } from "https://esm.sh/three@0.154.0/examples/jsm/loaders/GLTFLoader.js";
import { DRACOLoader } from "https://esm.sh/three@0.154.0/examples/jsm/loaders/DRACOLoader.js";
import { FilesetResolver, FaceDetector } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(0.6, 1.4, 1.0);

const fill = new THREE.HemisphereLight(0xffffff, 0x222222, 0.35);
const rim = new THREE.DirectionalLight(0xffffff, 0.45);
rim.position.set(-1.0, 0.9, -0.7);

scene.add(key, fill, rim);

const modelGroup = new THREE.Group();
scene.add(modelGroup);

let cameraDist = 1;
let centerY = 0;

const pivot = new THREE.Object3D();
modelGroup.add(pivot);

const sidePivots = {};
for (const side of ["top", "bottom", "left", "right"]) {
  const p = new THREE.Object3D();
  modelGroup.add(p);
  sidePivots[side] = p;
}

const MODEL_URLS = [
  "./the_map_of_the_world_tablet.glb",
  "../Holographic_Display_s/the_map_of_the_world_tablet.glb",
  "../Holographic_Display_Controller/the_map_of_the_world_tablet.glb",
  "../Museum_Artifact_Viewer/the_map_of_the_world_tablet.glb",
  "../Cubic_DIsplay_System/the_map_of_the_world_tablet.glb"
];

const draco = new DRACOLoader();
draco.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");

const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

function loadFirstAvailable(urls, onLoad) {
  const tryLoad = (index) => {
    if (index >= urls.length) {
      console.error("Failed to load model from all candidate paths", urls);
      return;
    }

    loader.load(urls[index], onLoad, undefined, () => tryLoad(index + 1));
  };

  tryLoad(0);
}

loadFirstAvailable(MODEL_URLS, (gltf) => {
  const root = gltf.scene;

  root.traverse((obj) => {
    if (obj.isMesh) {
      obj.castShadow = false;
      obj.receiveShadow = false;
      obj.material.roughness ??= 0.7;
      obj.material.metalness ??= 0.05;
    }
  });

  const box = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3();
  box.getSize(size);

  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 0.45 / maxDim;
  root.scale.setScalar(scale);
  root.updateMatrixWorld(true);

  box.setFromObject(root);
  const center = new THREE.Vector3();
  box.getCenter(center);
  root.position.sub(center);

  pivot.add(root);

  for (const side of ["top", "bottom", "left", "right"]) {
    const clone = root.clone(true);
    sidePivots[side].add(clone);
  }

  cameraDist = Math.max(size.length() * scale * 1.2, 0.6);
});

function createView(canvas) {
  const cam = new THREE.PerspectiveCamera(50, 1, 0.01, 200);
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: false,
    powerPreference: "high-performance"
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  return { cam, renderer };
}

const views = {
  top: createView(document.getElementById("view-top")),
  bottom: createView(document.getElementById("view-bottom")),
  left: createView(document.getElementById("view-left")),
  right: createView(document.getElementById("view-right"))
};

function resizeViews() {
  for (const key of Object.keys(views)) {
    const { cam, renderer } = views[key];
    const width = Math.max(renderer.domElement.clientWidth, 1);
    const height = Math.max(renderer.domElement.clientHeight, 1);
    cam.aspect = width / height;
    cam.updateProjectionMatrix();
    renderer.setSize(width, height, false);
  }
}

resizeViews();
window.addEventListener("resize", resizeViews);

// Edit these values in code for your 4-camera setup.
const MULTI_CAMERA_CONFIG = {
  autoStart: true,
  singleCameraTestMode: {
    enabled: true,
    side: "bottom"
  },
  detectIntervalMs: 66,
  minDetectionConfidence: 0.55,
  rotGainX: 0.45,
  rotGainY: 0.55,
  depthNearOffset: -0.10,
  depthFarOffset: 0.18,
  smoothingRotation: 0.07,
  smoothingDepth: 0.05,
  faceLostGraceMs: 500,
  jitterThreshold: 0.02,
  expectedFaceSize: {
    min: 0.07,
    max: 0.50
  },
  // Optional: set each camera's deviceId string to lock it to that side.
  cameraDeviceIdsBySide: {
    top: "",
    bottom: "",
    left: "",
    right: ""
  },
  // Flip axes per side if a mounted camera appears mirrored/upside-down.
  sideMapping: {
    top: { invertX: false, invertY: false },
    bottom: { invertX: false, invertY: false },
    left: { invertX: false, invertY: false },
    right: { invertX: false, invertY: false }
  }
};

const SIDE_KEYS = ["top", "bottom", "left", "right"];
const sideVideo = {};
const sideStream = {};
const sideLastDetectTime = {
  top: 0,
  bottom: 0,
  left: 0,
  right: 0
};

function makeSideState() {
  return {
    hasFace: false, lastFaceTime: 0,
    rotX: 0, rotY: 0,
    targetRotX: 0, targetRotY: 0,
    depthOffset: 0, targetDepthOffset: 0,
    prevNormX: 0, prevNormY: 0, prevFaceSize: 0
  };
}

const sideTrackingState = {
  top: makeSideState(),
  bottom: makeSideState(),
  left: makeSideState(),
  right: makeSideState()
};

let multiCameraTrackingActive = false;
let trackingLoopId = null;
let faceDetector = null;

const channel = new BroadcastChannel("hologram-control");

// Fallback controller rotation when side tracking is unavailable.
let fallbackRotX = 0;
let fallbackRotY = 0;
let fallbackTargetX = 0;
let fallbackTargetY = 0;

channel.onmessage = (event) => {
  if (multiCameraTrackingActive) return;
  const data = event.data;
  if (!data) return;

  fallbackTargetX = data.rotX ?? 0;
  fallbackTargetY = data.rotY ?? 0;
};

function normalizeAngleRadians(angle) {
  return Math.atan2(Math.sin(angle), Math.cos(angle));
}

function smoothAngle(current, next, alpha) {
  const delta = normalizeAngleRadians(next - current);
  return current + delta * alpha;
}

function setSideStatus(sideKey, message) {
  console.info(`[${sideKey}] ${message}`);
}

function createHiddenVideoElement() {
  const video = document.createElement("video");
  video.autoplay = true;
  video.muted = true;
  video.playsInline = true;
  return video;
}

function getTrackingSides() {
  if (!MULTI_CAMERA_CONFIG.singleCameraTestMode.enabled) {
    return SIDE_KEYS;
  }

  const requestedSide = MULTI_CAMERA_CONFIG.singleCameraTestMode.side;
  if (SIDE_KEYS.includes(requestedSide)) {
    return [requestedSide];
  }

  console.warn("singleCameraTestMode.side is invalid; defaulting to top");
  return ["top"];
}

function getLargestDetection(detections) {
  if (!detections || detections.length === 0) return null;

  return detections.reduce((largest, current) => {
    const currentArea = current.boundingBox.width * current.boundingBox.height;
    const largestArea = largest.boundingBox.width * largest.boundingBox.height;
    return currentArea > largestArea ? current : largest;
  });
}

function mapDetectionToTrackingTarget(detection, sideKey) {
  const width = detection.boundingBox.width;
  const height = detection.boundingBox.height;
  const centerX = detection.boundingBox.originX + (width * 0.5);
  const centerY = detection.boundingBox.originY + (height * 0.5);

  const frameWidth = sideVideo[sideKey].videoWidth;
  const frameHeight = sideVideo[sideKey].videoHeight;

  if (!frameWidth || !frameHeight) return null;

  const rawNormX = THREE.MathUtils.clamp(((centerX / frameWidth) - 0.5) * 2, -1, 1);
  const rawNormY = THREE.MathUtils.clamp(((centerY / frameHeight) - 0.5) * 2, -1, 1);
  const faceSize = Math.max(width / frameWidth, height / frameHeight);

  if (
    faceSize < MULTI_CAMERA_CONFIG.expectedFaceSize.min
    || faceSize > MULTI_CAMERA_CONFIG.expectedFaceSize.max
  ) {
    return null;
  }

  const state = sideTrackingState[sideKey];
  const jitter = MULTI_CAMERA_CONFIG.jitterThreshold;

  const filteredX = Math.abs(rawNormX - state.prevNormX) < jitter ? state.prevNormX : rawNormX;
  const filteredY = Math.abs(rawNormY - state.prevNormY) < jitter ? state.prevNormY : rawNormY;
  const filteredSize = Math.abs(faceSize - state.prevFaceSize) < jitter ? state.prevFaceSize : faceSize;

  state.prevNormX = filteredX;
  state.prevNormY = filteredY;
  state.prevFaceSize = filteredSize;

  const sideMapping = MULTI_CAMERA_CONFIG.sideMapping[sideKey] || { invertX: false, invertY: false };
  const mappedX = sideMapping.invertX ? -filteredX : filteredX;
  const mappedY = sideMapping.invertY ? -filteredY : filteredY;

  const depthNorm = THREE.MathUtils.clamp(
    (filteredSize - MULTI_CAMERA_CONFIG.expectedFaceSize.min)
    / Math.max(MULTI_CAMERA_CONFIG.expectedFaceSize.max - MULTI_CAMERA_CONFIG.expectedFaceSize.min, 0.0001),
    0,
    1
  );

  return {
    rotX: THREE.MathUtils.clamp(-mappedY * MULTI_CAMERA_CONFIG.rotGainX, -0.65, 0.65),
    rotY: THREE.MathUtils.clamp(mappedX * MULTI_CAMERA_CONFIG.rotGainY, -0.65, 0.65),
    depthOffset: THREE.MathUtils.lerp(MULTI_CAMERA_CONFIG.depthFarOffset, MULTI_CAMERA_CONFIG.depthNearOffset, depthNorm)
  };
}

async function ensureFaceDetector() {
  if (faceDetector) return faceDetector;

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  faceDetector = await FaceDetector.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
    },
    runningMode: "VIDEO",
    minDetectionConfidence: MULTI_CAMERA_CONFIG.minDetectionConfidence
  });

  return faceDetector;
}

async function enumerateVideoInputs() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  return devices.filter((device) => device.kind === "videoinput");
}

async function openCameraForSide(sideKey, fallbackDevice) {
  const configuredDeviceId = MULTI_CAMERA_CONFIG.cameraDeviceIdsBySide[sideKey] || "";
  const selectedDeviceId = configuredDeviceId || fallbackDevice?.deviceId;

  const constraints = {
    video: {
      width: { ideal: 640 },
      height: { ideal: 480 },
      frameRate: { ideal: 30 }
    },
    audio: false
  };

  if (selectedDeviceId) {
    constraints.video.deviceId = { exact: selectedDeviceId };
  }

  const stream = await navigator.mediaDevices.getUserMedia(constraints);
  const video = createHiddenVideoElement();
  video.srcObject = stream;
  await video.play();

  sideStream[sideKey] = stream;
  sideVideo[sideKey] = video;
  setSideStatus(sideKey, "camera live");
}

function stopMultiCameraTracking() {
  multiCameraTrackingActive = false;

  if (trackingLoopId !== null) {
    cancelAnimationFrame(trackingLoopId);
    trackingLoopId = null;
  }

  for (const sideKey of SIDE_KEYS) {
    const stream = sideStream[sideKey];
    if (stream) {
      stream.getTracks().forEach((track) => track.stop());
      sideStream[sideKey] = null;
    }
    sideVideo[sideKey] = null;
  }
}

function processTrackingFrame() {
  if (!multiCameraTrackingActive || !faceDetector) return;

  const now = performance.now();

  for (const sideKey of SIDE_KEYS) {
    const currentVideo = sideVideo[sideKey];
    const state = sideTrackingState[sideKey];

    if (!currentVideo || currentVideo.readyState < 2) {
      state.hasFace = false;
      continue;
    }

    if ((now - sideLastDetectTime[sideKey]) < MULTI_CAMERA_CONFIG.detectIntervalMs) {
      continue;
    }

    sideLastDetectTime[sideKey] = now;
    const result = faceDetector.detectForVideo(currentVideo, now);
    const largest = getLargestDetection(result?.detections);

    if (!largest) {
      if ((now - state.lastFaceTime) > MULTI_CAMERA_CONFIG.faceLostGraceMs) {
        state.hasFace = false;
      }
      continue;
    }

    const mapped = mapDetectionToTrackingTarget(largest, sideKey);
    if (!mapped) {
      if ((now - state.lastFaceTime) > MULTI_CAMERA_CONFIG.faceLostGraceMs) {
        state.hasFace = false;
      }
      continue;
    }

    state.hasFace = true;
    state.lastFaceTime = now;
    state.targetRotX = mapped.rotX;
    state.targetRotY = mapped.rotY;
    state.targetDepthOffset = mapped.depthOffset;
  }

  trackingLoopId = requestAnimationFrame(processTrackingFrame);
}

async function startMultiCameraTracking() {
  if (multiCameraTrackingActive) return;

  try {
    await ensureFaceDetector();
    const videoInputs = await enumerateVideoInputs();
    const trackingSides = getTrackingSides();

    if (videoInputs.length < 1) {
      throw new Error("No video inputs found");
    }

    for (let index = 0; index < trackingSides.length; index += 1) {
      const sideKey = trackingSides[index];
      const fallbackDevice = videoInputs[index] || videoInputs[videoInputs.length - 1];
      await openCameraForSide(sideKey, fallbackDevice);
      sideLastDetectTime[sideKey] = 0;
    }

    multiCameraTrackingActive = true;
    processTrackingFrame();
    console.info(`${trackingSides.length}-camera tracking active (${trackingSides.join(", ")})`);
  } catch (error) {
    console.error("Failed to start 4-camera tracking", error);
    stopMultiCameraTracking();
  }
}

window.addEventListener("beforeunload", () => {
  stopMultiCameraTracking();
});

if (MULTI_CAMERA_CONFIG.autoStart) {
  startMultiCameraTracking();
}

function render() {
  fallbackRotX += (fallbackTargetX - fallbackRotX) * MULTI_CAMERA_CONFIG.smoothingRotation;
  fallbackRotY = smoothAngle(fallbackRotY, fallbackTargetY, MULTI_CAMERA_CONFIG.smoothingRotation);

  for (const key of Object.keys(views)) {
    const sideState = sideTrackingState[key];
    const { cam, renderer } = views[key];
    const hasPerSideTracking = multiCameraTrackingActive && sideState.hasFace;

    const targetRotX = hasPerSideTracking ? sideState.targetRotX : fallbackRotX;
    const targetRotY = hasPerSideTracking ? sideState.targetRotY : fallbackRotY;
    const targetDepth = hasPerSideTracking ? sideState.targetDepthOffset : 0;

    sideState.rotX += (targetRotX - sideState.rotX) * MULTI_CAMERA_CONFIG.smoothingRotation;
    sideState.rotY = smoothAngle(sideState.rotY, targetRotY, MULTI_CAMERA_CONFIG.smoothingRotation);
    sideState.depthOffset += (targetDepth - sideState.depthOffset) * MULTI_CAMERA_CONFIG.smoothingDepth;

    const activeCameraDist = cameraDist * (1 + sideState.depthOffset);
    const poses = {
      top: [0, centerY, activeCameraDist],
      bottom: [0, centerY, -activeCameraDist],
      left: [-activeCameraDist, centerY, 0],
      right: [activeCameraDist, centerY, 0]
    };

    const [x, y, z] = poses[key];
    cam.position.set(x, y, z);
    cam.lookAt(0, centerY, 0);

    const sp = sidePivots[key];
    sp.visible = true;
    pivot.visible = false;

    if (key === "top" || key === "bottom") {
      sp.rotation.x = sideState.rotX;
      sp.rotation.y = sideState.rotY;
      sp.rotation.z = 0;
    } else if (key === "left") {
      sp.rotation.z = sideState.rotX;
      sp.rotation.y = sideState.rotY;
      sp.rotation.x = 0;
    } else {
      sp.rotation.z = -sideState.rotX;
      sp.rotation.y = sideState.rotY;
      sp.rotation.x = 0;
    }

    for (const otherKey of SIDE_KEYS) {
      if (otherKey !== key) sidePivots[otherKey].visible = false;
    }

    renderer.render(scene, cam);
  }

  requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
