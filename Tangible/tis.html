<html lang="en">

	<head>
		<title>frolic_tis</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				color: #fff;
				font-family:Monospace;
				font-size:13px;
				text-align:center;

				background-color: #000;

				margin: 0px;
				overflow: hidden;
			}
			a { color: #00f }

			#info {
				position: absolute;
				top: 0px; width: 100%;
				padding: 5px;
			}
		</style>
	</head>
	
	<body>
	    <div class="permission" id="permission_button">
          <button type="button" onclick="permission()">Grant Permission</button>
      </div>

		<div id="container"></div>
		
		<!-- load javascript libraries and functions we're going to need -->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
		
		<script src="../build/three.js"></script>
		<script src="../js/WebGL.js"></script>


		<script src="../js/loaders/RGBELoader.js"></script>
		<script src="../js/loaders/HDRCubeTextureLoader.js"></script>

		<script src="../js/pmrem/PMREMGenerator.js"></script>
		<script src="../js/pmrem/PMREMCubeUVPacker.js"></script>
		
		<script src="../js/controls/DeviceOrientationControls.js"></script>


		<script>
		
			// make sure webGL is available
			if ( WEBGL.isWebGLAvailable() === false ) {
				document.body.appendChild( WEBGL.getWebGLErrorMessage() );	
				}
				
			// define some global variables
			var container;
			var camera, scene, renderer, controls;
			var hdrCubeRenderTarget, hdrCubeMap;

			// do stuff
			init();
			animate();
			

			function init() {

				// create a container for the graphics content
				container = document.createElement('div');
				document.body.appendChild(container);
				
				// create a renderer for the graphics content
				renderer = new THREE.WebGLRenderer();
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.toneMapping = THREE.ReinhardToneMapping;
				renderer.gammaInput = true;
				renderer.gammaOutput = true;
			
				// attach the renderer to the container
				container.appendChild(renderer.domElement);


				// create a new graphics scene
				scene = new THREE.Scene();

				// load a HDR cubemap to serve as the scene background and object illumination map
				var hdrUrls = [ 'px.hdr', 'nx.hdr', 'py.hdr', 'ny.hdr', 'pz.hdr', 'nz.hdr' ];
				hdrCubeMap = new THREE.HDRCubeTextureLoader()
					.setPath( './textures/env/ennis/' )
					.load( THREE.UnsignedByteType, hdrUrls, function() {

						var pmremGenerator = new THREE.PMREMGenerator(hdrCubeMap);
						pmremGenerator.update(renderer);

						var pmremCubeUVPacker = new THREE.PMREMCubeUVPacker(pmremGenerator.cubeLods);
						pmremCubeUVPacker.update(renderer);

						hdrCubeRenderTarget = pmremCubeUVPacker.CubeUVRenderTarget;

						hdrCubeMap.magFilter = THREE.LinearFilter;
						hdrCubeMap.needsUpdate = true;

						pmremGenerator.dispose();
						pmremCubeUVPacker.dispose();

						});
						
				// set the cubemap as the scene background
				scene.background = hdrCubeMap;
				
				// add an object to the scene
				var geometry = new THREE.PlaneGeometry(1024,1024,32,8);
				var material = new THREE.MeshStandardMaterial({
				
					map: new THREE.TextureLoader().load('./textures/obj/frolic/A1024.png'),
					
					metalness: 1.0,
					metalnessMap: new THREE.TextureLoader().load('./textures/obj/frolic/M1024.png'),

					roughness: 1.0,
					roughnessMap: new THREE.TextureLoader().load('./textures/obj/frolic/R1024.png'),
					
					displacementMap: new THREE.TextureLoader().load('./textures/obj/frolic/H1024.png'),
					displacementScale: 10.0,
					displacementBias: 0.0,
					
					normalMap: new THREE.TextureLoader().load('./textures/obj/frolic/N1024.png'),
					normalScale: new THREE.Vector2(1,1),
					
					alphaMap: new THREE.TextureLoader().load('./textures/obj/frolic/T1024.png'),
					transparent: true,
					
					side: THREE.DoubleSide	
					
					});
					
					
				objMesh = new THREE.Mesh(geometry, material);
				objMesh.lookAt(new THREE.Vector3(0,0,1));
				scene.add(objMesh);
				
				// add a camera to the scene
				camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 3000);
				camera.position.set(0, 0, 1000);
				camera.lookAt(0, 0, 0);				

				// lock the object and camera together
				objMesh.add(camera);
				
				// add accelerometer controls to the object/camera group
				controls = new THREE.DeviceOrientationControls(objMesh);

				// add a listener to handle window resizing
				window.addEventListener( 'resize', onWindowResize, false );

			}


			// animation loop
			function animate() {
				requestAnimationFrame(animate);
				// get orientation info from the accelerometer
				controls.update();				
				render();
				}

			// scene renderer
			function render() {			
				var renderTarget, newEnvMap;

				// update the object env map if necessary
				renderTarget = hdrCubeRenderTarget;
				newEnvMap = renderTarget ? renderTarget.texture : null;
				if ( newEnvMap && newEnvMap !== objMesh.material.envMap ) {
					objMesh.material.envMap = newEnvMap;
					objMesh.material.needsUpdate = true;
					}

				// render the scene
				renderer.render(scene, camera);	
				}
						
			// window resize handler	
			function onWindowResize() {
				var width = window.innerWidth;
				var height = window.innerHeight;
				camera.aspect = width/height;
				camera.updateProjectionMatrix();
				renderer.setSize(width, height);
				}
				
				
	function permission(){
         if (typeof DeviceOrientationEvent !== 'function') {
                $(".permission").remove();
                document.getElementById('info').innerHTML ="DeviceOrientationEvent not detected" ;
         }
         if (typeof DeviceOrientationEvent.requestPermission !== 'function') {
                $(".permission").remove();
                document.getElementById('info').innerHTML ="DeviceOrientationEvent.requestPermission not detected" ;
         }
         DeviceOrientationEvent.requestPermission().then(function(result) {
             $(".permission").remove();
             document.getElementById('info').innerHTML = "tangible display using three.js";
             return run();
         });
     }

		</script>

	</body>
</html>
