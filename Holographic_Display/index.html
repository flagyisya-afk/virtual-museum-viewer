<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mouse-Controlled 3D Cube</title>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    .position {
      position: absolute;
      width: 150px;
      height: 150px;
      perspective: 800px;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .face {
      position: absolute;
      width: 150px;
      height: 150px;
      background: rgba(0, 255, 0, 0.7);
      border: 2px solid lime;
    }

    /* Cube faces */
    .face-front  { transform: translateZ(75px); }
    .face-back   { transform: rotateY(180deg) translateZ(75px); }
    .face-right  { transform: rotateY(90deg) translateZ(75px); }
    .face-left   { transform: rotateY(-90deg) translateZ(75px); }
    .face-top    { transform: rotateX(90deg) translateZ(75px); }
    .face-bottom { transform: rotateX(-90deg) translateZ(75px); }

    /* Screen positions */
    .pos-top {
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .pos-bottom {
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) rotate(180deg);
    }

    .pos-left {
      left: 0;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
    }

    .pos-right {
      right: 0;
      top: 50%;
      transform: translateY(-50%) rotate(90deg);
    }
  </style>
</head>

<body>

  <!-- TOP -->
  <div class="position pos-top">
    <div class="cube">
      <div class="face face-front"></div>
      <div class="face face-back"></div>
      <div class="face face-right"></div>
      <div class="face face-left"></div>
      <div class="face face-top"></div>
      <div class="face face-bottom"></div>
    </div>
  </div>

  <!-- BOTTOM -->
  <div class="position pos-bottom">
    <div class="cube">
      <div class="face face-front"></div>
      <div class="face face-back"></div>
      <div class="face face-right"></div>
      <div class="face face-left"></div>
      <div class="face face-top"></div>
      <div class="face face-bottom"></div>
    </div>
  </div>

  <!-- LEFT -->
  <div class="position pos-left">
    <div class="cube">
      <div class="face face-front"></div>
      <div class="face face-back"></div>
      <div class="face face-right"></div>
      <div class="face face-left"></div>
      <div class="face face-top"></div>
      <div class="face face-bottom"></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="position pos-right">
    <div class="cube">
      <div class="face face-front"></div>
      <div class="face face-back"></div>
      <div class="face face-right"></div>
      <div class="face face-left"></div>
      <div class="face face-top"></div>
      <div class="face face-bottom"></div>
    </div>
  </div>

  <script>
    const cubes = document.querySelectorAll('.cube');

    let rotX = 0;
    let rotY = 0;
    let targetX = 0;
    let targetY = 0;

    document.addEventListener('mousemove', e => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      targetY = (e.clientX - cx) * 0.15;
      targetX = -(e.clientY - cy) * 0.15;
    });

    function animate() {
      rotX += (targetX - rotX) * 0.1;
      rotY += (targetY - rotY) * 0.1;

      cubes.forEach(cube => {
        cube.style.transform =
          `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
