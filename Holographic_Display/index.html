<script type="module">
import * as THREE from "https://esm.sh/three@0.154.0";
import { GLTFLoader } from "https://esm.sh/three@0.154.0/examples/jsm/loaders/GLTFLoader.js";
import { DRACOLoader } from "https://esm.sh/three@0.154.0/examples/jsm/loaders/DRACOLoader.js";

/* ===============================
   CONTROLLER SYNC
================================ */
const CHANNEL = "pandoras-hologram";
let sharedState = {
  rotX: 0,
  rotY: 0,
  scale: 1,
  preset: "museum"
};

const channel = "BroadcastChannel" in window
  ? new BroadcastChannel(CHANNEL)
  : null;

if (channel) {
  channel.onmessage = e => {
    sharedState = e.data;
  };
}

window.addEventListener("storage", e => {
  if (e.key === "pandoras-hologram") {
    sharedState = JSON.parse(e.newValue);
  }
});

// pull last known state on load
const saved = localStorage.getItem("pandoras-hologram");
if (saved) sharedState = JSON.parse(saved);

/* ===============================
   SCENE
================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

/* ===============================
   LIGHTING
================================ */
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(0.6, 1.4, 1.0);

const fill = new THREE.HemisphereLight(0xffffff, 0x222222, 0.35);
const rim = new THREE.DirectionalLight(0xffffff, 0.45);
rim.position.set(-1.0, 0.9, -0.7);

scene.add(key, fill, rim);

/* ===============================
   MODEL GROUP
================================ */
const modelGroup = new THREE.Group();
scene.add(modelGroup);

let currentModel = null;
let baseScale = 1;
let cameraDist = 1;
let centerY = 0;

/* ===============================
   LOAD MODEL
================================ */
const MODEL_URL = "../the_map_of_the_world_tablet.glb";

const draco = new DRACOLoader();
draco.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

loader.load(MODEL_URL, gltf => {
  currentModel = gltf.scene;

  currentModel.traverse(m => {
    if (m.isMesh) {
      m.castShadow = false;
      m.receiveShadow = false;
      m.material.roughness ??= 0.7;
      m.material.metalness ??= 0.05;
    }
  });

  const box = new THREE.Box3().setFromObject(currentModel);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);

  baseScale = 0.45 / Math.max(size.x, size.y, size.z);
  currentModel.scale.setScalar(baseScale);

  currentModel.position.set(
    -center.x * baseScale,
    -center.y * baseScale,
    -center.z * baseScale
  );

  currentModel.rotation.y = Math.PI;
  modelGroup.add(currentModel);

  cameraDist = Math.max(size.length() * baseScale * 1.2, 0.6);
  centerY = 0;
});

/* ===============================
   CAMERAS
================================ */
function createView(canvas) {
  const cam = new THREE.PerspectiveCamera(50, 1, 0.01, 200);
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: false
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  return { cam, renderer };
}

const views = {
  top: createView(document.getElementById("view-top")),
  bottom: createView(document.getElementById("view-bottom")),
  left: createView(document.getElementById("view-left")),
  right: createView(document.getElementById("view-right")),
};

/* ===============================
   PRESET MIRRORING
================================ */
function applyPreset(name) {
  if (name === "studio") {
    key.intensity = 1.8;
    fill.intensity = 0.15;
    rim.intensity = 0.9;
  }
  if (name === "museum") {
    key.intensity = 1.05;
    fill.intensity = 0.35;
    rim.intensity = 0.45;
  }
  if (name === "warm") {
    key.intensity = 1.0;
    key.color.set(0xfff1dc);
    fill.intensity = 0.3;
    rim.intensity = 0.35;
  }
}

/* ===============================
   RENDER LOOP
================================ */
function render() {
  if (currentModel) {
    modelGroup.rotation.x = sharedState.rotX || 0;
    modelGroup.rotation.y = sharedState.rotY || 0;

    currentModel.scale.setScalar(
      baseScale * (sharedState.scale || 1)
    );

    applyPreset(sharedState.preset);
  }

  const poses = {
    top:    [ 0, centerY,  cameraDist],
    bottom: [ 0, centerY, -cameraDist],
    left:   [-cameraDist, centerY, 0],
    right:  [ cameraDist, centerY, 0],
  };

  for (const k in views) {
    const { cam, renderer } = views[k];
    const [x,y,z] = poses[k];

    cam.position.set(x,y,z);
    cam.lookAt(0, centerY, 0);

    const r = renderer.domElement.getBoundingClientRect();
    cam.aspect = r.width / r.height;
    cam.updateProjectionMatrix();
    renderer.setSize(r.width, r.height, false);
    renderer.render(scene, cam);
  }

  requestAnimationFrame(render);
}

render();
console.log("Holographic display synced & live");
</script>
