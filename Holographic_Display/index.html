<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Holographic Artifact Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
  width: 100%;
  height: 100%;
}

/* Cross layout */
.position {
  position: absolute;
  width: 40vmin;
  height: 40vmin;
  perspective: 800px;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* TOP */
.pos-top {
  top: 0;
  left: 50%;
  transform: translateX(-50%);
}

/* BOTTOM (flipped) */
.pos-bottom {
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) rotate(180deg);
}

/* LEFT */
.pos-left {
  left: 0;
  top: 50%;
  transform: translateY(-50%) rotate(-90deg);
}

/* RIGHT */
.pos-right {
  right: 0;
  top: 50%;
  transform: translateY(-50%) rotate(90deg);
}
</style>
</head>

<body>

<div class="position pos-top"><canvas id="view-top"></canvas></div>
<div class="position pos-bottom"><canvas id="view-bottom"></canvas></div>
<div class="position pos-left"><canvas id="view-left"></canvas></div>
<div class="position pos-right"><canvas id="view-right"></canvas></div>

<script type="module">
import * as THREE from "https://esm.sh/three@0.154.0";
import { GLTFLoader } from "https://esm.sh/three@0.154.0/examples/jsm/loaders/GLTFLoader.js";
import { DRACOLoader } from "https://esm.sh/three@0.154.0/examples/jsm/loaders/DRACOLoader.js";

/* === Scene === */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

/* === Lighting (museum-balanced, hologram-safe) === */
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(0.6, 1.4, 1.0);

const fill = new THREE.HemisphereLight(0xffffff, 0x222222, 0.35);
const rim = new THREE.DirectionalLight(0xffffff, 0.45);
rim.position.set(-1.0, 0.9, -0.7);

scene.add(key, fill, rim);

/* === Model Group === */
const modelGroup = new THREE.Group();
scene.add(modelGroup);

let currentModel = null;
let cameraDist = 1;
let centerY = 0;

/* === Load GLB === */
const MODEL_URL = "../the_map_of_the_world_tablet.glb";

const draco = new DRACOLoader();
draco.setDecoderPath("https://www.gstatic.com/draco/v1/decoders/");
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

loader.load(MODEL_URL, gltf => {
  currentModel = gltf.scene;

  currentModel.traverse(m => {
    if (m.isMesh) {
      m.castShadow = false;
      m.receiveShadow = false;
      m.material.roughness ??= 0.7;
      m.material.metalness ??= 0.05;
    }
  });

  // Normalize & center
  const box = new THREE.Box3().setFromObject(currentModel);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);

  const scale = 0.45 / Math.max(size.x, size.y, size.z);
  currentModel.scale.setScalar(scale);
  currentModel.position.set(
    -center.x * scale,
    -center.y * scale,
    -center.z * scale
  );

  currentModel.rotation.y = Math.PI;
  modelGroup.add(currentModel);

  cameraDist = Math.max(size.length() * scale * 1.2, 0.6);
  centerY = 0;
});

/* === Cameras === */
function createView(canvas) {
  const cam = new THREE.PerspectiveCamera(50, 1, 0.01, 200);
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: false
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  return { cam, renderer };
}

const views = {
  top: createView(document.getElementById("view-top")),
  bottom: createView(document.getElementById("view-bottom")),
  left: createView(document.getElementById("view-left")),
  right: createView(document.getElementById("view-right")),
};

/* === Mouse-controlled rotation === */
let rotX = 0, rotY = 0;
let targetX = 0, targetY = 0;

document.addEventListener("mousemove", e => {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;

  targetY = (e.clientX - cx) * 0.002;
  targetX = (e.clientY - cy) * 0.002;
});

/* === Render loop === */
function render() {
  rotX += (targetX - rotX) * 0.08;
  rotY += (targetY - rotY) * 0.08;

  modelGroup.rotation.x = rotX;
  modelGroup.rotation.y = rotY;

  const poses = {
    top:    [ 0, centerY,  cameraDist],
    bottom: [ 0, centerY, -cameraDist],
    left:   [-cameraDist, centerY, 0],
    right:  [ cameraDist, centerY, 0],
  };

  for (const key in views) {
    const { cam, renderer } = views[key];
    const [x,y,z] = poses[key];
    cam.position.set(x,y,z);
    cam.lookAt(0, centerY, 0);

    const r = renderer.domElement.getBoundingClientRect();
    cam.aspect = r.width / r.height;
    cam.updateProjectionMatrix();
    renderer.setSize(r.width, r.height, false);
    renderer.render(scene, cam);
  }

  requestAnimationFrame(render);
}
render();

console.log("Holographic viewer active");
</script>

</body>
</html>
