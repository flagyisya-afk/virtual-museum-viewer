<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Papyrus Info — Hand-Tracked Magnifier</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/examples/jsm/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>
  <style>
    @font-face {
      font-family: "TamaConnect";
      src: url("../Menu/tamaconnecttype.ttf") format("truetype");
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      overflow: hidden;
      font-family: "TamaConnect", sans-serif;
      background: #0f0f14;
      color: #fff;
      touch-action: none;
    }

    canvas { display: block; }

    /* ── Back button ── */
    #backLink {
      position: fixed; top: 12px; left: 12px;
      background: rgba(0,0,0,0.65); color: #fff;
      text-decoration: none; padding: 8px 14px;
      border-radius: 10px; font-size: 13px; z-index: 50;
    }
    #backLink:hover { background: rgba(255,255,255,0.15); }

    /* ── Status pill ── */
    #status {
      position: fixed; top: 12px; right: 12px;
      background: rgba(0,0,0,0.65); padding: 8px 12px;
      border-radius: 10px; font-size: 12px; z-index: 50;
      transition: opacity 1s;
    }

    /* ── Flip button ── */
    #flipBtn {
      position: fixed; bottom: 24px; right: 24px;
      background: rgba(0,0,0,0.7); color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 10px 18px; border-radius: 12px;
      font-family: "TamaConnect", sans-serif;
      font-size: 14px; cursor: pointer; z-index: 50;
      transition: background 0.2s;
    }
    #flipBtn:hover { background: rgba(255,255,255,0.15); }

    /* ── Hint ── */
    #hint {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65); padding: 6px 14px;
      border-radius: 10px; font-size: 12px; z-index: 50;
      opacity: 1; transition: opacity 1s;
      pointer-events: none;
    }

    /* ── SVG annotation overlay ── */
    #annotationLayer {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 30;
    }

    /* ── Numbered hotspot markers ── */
    .hotspot {
      position: absolute;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(240,217,160,0.85);
      color: #1a1a1a;
      font-family: "TamaConnect", sans-serif;
      font-size: 15px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 40;
      pointer-events: auto;
      border: 2px solid rgba(255,255,255,0.4);
      box-shadow: 0 0 10px rgba(240,217,160,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot:hover {
      transform: scale(1.2);
      box-shadow: 0 0 18px rgba(240,217,160,0.7);
    }
    .hotspot.active {
      background: #f0d9a0;
      box-shadow: 0 0 20px rgba(240,217,160,0.9);
    }

    /* ── Info card (single, shown on click) ── */
    #infoCard {
      position: fixed;
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      padding: 14px 16px;
      max-width: 260px;
      display: none;
      align-items: flex-start; gap: 10px;
      z-index: 45;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #infoCard.visible { opacity: 1; display: flex; }
    #infoCard img.tama-icon {
      width: 38px; height: 38px; flex-shrink: 0;
      margin-top: 2px;
    }
    #infoCard .card-body h4 {
      font-size: 14px; margin-bottom: 5px;
      color: #f0d9a0;
    }
    #infoCard .card-body p {
      font-size: 12px; line-height: 1.5;
      color: #ccc;
    }
    #infoCard .close-btn {
      position: absolute; top: 6px; right: 10px;
      background: none; border: none; color: #888;
      font-size: 18px; cursor: pointer; line-height: 1;
    }
    #infoCard .close-btn:hover { color: #fff; }

    /* ── Side label (front / back) ── */
    #sideLabel {
      position: fixed; top: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6); padding: 6px 16px;
      border-radius: 10px; font-size: 14px; z-index: 50;
      color: #f0d9a0;
    }

    /* ── Hand tracking controls ── */
    #trackingControls {
      position: fixed; bottom: 24px; left: 24px;
      display: flex; gap: 8px; z-index: 50;
    }
    #trackingControls button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 10px 14px;
      cursor: pointer;
      font-family: "TamaConnect", sans-serif;
      font-size: 13px;
      transition: background 0.2s;
    }
    #trackingControls button:hover {
      background: rgba(255,255,255,0.15);
    }
    #trackingControls button.primary {
      border: none;
      background: linear-gradient(90deg, #e0cc9a, #f5e8c9);
      color: #1d1304;
      font-weight: 600;
    }

    #gestureLabel {
      position: fixed; bottom: 70px; left: 24px;
      background: rgba(0,0,0,0.6); padding: 5px 12px;
      border-radius: 8px; font-size: 11px; z-index: 50;
      color: #f0d9a0;
      opacity: 0; transition: opacity 0.3s;
    }
    #gestureLabel.visible { opacity: 1; }

    /* ── Camera preview ── */
    #cameraPreview {
      position: fixed;
      right: 12px; bottom: 70px;
      width: 180px; max-width: 30vw;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      opacity: 0.7;
      z-index: 15;
      transform: scaleX(-1);
      background: #000;
      display: none;
    }
    @media (max-width: 700px) {
      #cameraPreview { width: 120px; max-width: 35vw; }
    }
  </style>
</head>
<body>

<a id="backLink" href="../index.html">&larr; Back</a>
<div id="status">Loading model…</div>
<div id="sideLabel">Front</div>
<div id="hint">Tap a number to learn about the papyrus</div>
<button id="flipBtn">&#x21C5; Flip Over</button>

<svg id="annotationLayer"></svg>

<!-- Single reusable info card -->
<div id="infoCard">
  <img class="tama-icon" id="cardIcon" src="" alt="">
  <div class="card-body">
    <h4 id="cardTitle"></h4>
    <p id="cardText"></p>
  </div>
  <button class="close-btn" id="cardClose">&times;</button>
</div>

<!-- Hand tracking controls -->
<div id="trackingControls">
  <button id="startBtn" class="primary">&#9758; Start Hand Tracking</button>
  <button id="stopBtn">Stop</button>
</div>
<div id="gestureLabel"></div>
<video id="cameraPreview" autoplay playsinline muted></video>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// ─── Detect mobile ───
const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && window.innerWidth < 1024);

// ─── Annotation data ───
const annotations = [
  {
    id: "harvesting", num: 1,
    title: "1 · Harvesting",
    text: "The stocks of a cyperus papyrus are collected and the outer rind is removed, exposing the inner pith.",
    icon: "../FIP%20Tamagotchis/CuneiformEgg1.svg",
    anchorNorm: [0.22, 0.18], cardSide: "left", side: "front"
  },
  {
    id: "cutting", num: 2,
    title: "2 · Cutting",
    text: "The inner pith is cut into thin strips approximately 40 cm long.",
    icon: "../FIP%20Tamagotchis/BrokenCyperusPapyrus1.svg",
    anchorNorm: [0.78, 0.22], cardSide: "right", side: "front"
  },
  {
    id: "soaking", num: 3,
    title: "3 · Soaking",
    text: "The strips are soaked in water for several days to soften them.",
    icon: "../FIP%20Tamagotchis/SoakedPapyrus1.svg",
    anchorNorm: [0.25, 0.48], cardSide: "left", side: "front"
  },
  {
    id: "weaving", num: 4,
    title: "4 · Weaving",
    text: "The thin soaked strips are laid out in perpendicular layers and pressed together.",
    icon: "../FIP%20Tamagotchis/PerpendicularPapyrus1.svg",
    anchorNorm: [0.75, 0.52], cardSide: "right", side: "front"
  },
  {
    id: "drying", num: 5,
    title: "5 · Drying",
    text: "The layers are pressed under wooden boards for several days to flatten and dry, forming a smooth writing surface.",
    icon: "../FIP%20Tamagotchis/PapyrusPaper1.svg",
    anchorNorm: [0.30, 0.78], cardSide: "left", side: "front"
  },
  {
    id: "writing", num: 6,
    title: "6 · Writing",
    text: "Ink is made by burning organic materials, pulverizing the soot, and mixing with water and acacia gum binder. This stable ink does not fade or damage the papyrus.",
    icon: "../FIP%20Tamagotchis/PapyrusScroll1.svg",
    anchorNorm: [0.72, 0.80], cardSide: "right", side: "front"
  },
  {
    id: "backboard", num: 1,
    title: "1 · Backboard",
    text: "This papyrus was glued onto a backboard by previous curators to preserve it. Unfortunately, this can cause the material to break down, stain, or warp.",
    icon: "../FIP%20Tamagotchis/CyperusPapyrus1.svg",
    anchorNorm: [0.50, 0.45], cardSide: "right", side: "back"
  }
];

// ─── Scene ───
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f14);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
camera.position.set(0, 0, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.prepend(renderer.domElement);

// ─── Render target for post-processing lens ───
const drawingBufferSize = new THREE.Vector2();
renderer.getDrawingBufferSize(drawingBufferSize);
const sceneTarget = new THREE.WebGLRenderTarget(drawingBufferSize.x, drawingBufferSize.y);

// ─── Lighting ───
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(2, 2, 6);
scene.add(dirLight);

// Reveal spotlight that follows the hand
const revealLight = new THREE.SpotLight(0xffefc9, 0.0, 6, Math.PI / 8, 0.42, 1.0);
revealLight.position.set(0, 0, 4);
revealLight.castShadow = false;
revealLight.target.position.set(0, 0, 0);
revealLight.visible = false;
scene.add(revealLight, revealLight.target);
let revealLightTargetIntensity = 0.0;

// ─── Post-processing magnifying-glass lens shader ───
const lensCenter = new THREE.Vector2(0.5, 0.5);
const lensTarget = new THREE.Vector2(0.5, 0.5);
let lensVisible = false;
let lensRadiusTarget = 0.17;
let lensZoomTarget = 2.8;
let freezeLens = false;
let wasPinch = false;
let lastFreezeToggle = 0;
let gestureLabel = "none";
const tempNormal = new THREE.Vector3();
const tempLightPos = new THREE.Vector3();
const tempTargetPos = new THREE.Vector3();

const postScene = new THREE.Scene();
const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: sceneTarget.texture },
    uCenter: { value: lensCenter.clone() },
    uRadius: { value: 0.17 },
    uZoom:   { value: 2.8 },
    uSoftness: { value: 0.028 },
    uEnabled: { value: 0.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 uCenter;
    uniform float uRadius;
    uniform float uZoom;
    uniform float uSoftness;
    uniform float uEnabled;
    varying vec2 vUv;

    void main() {
      vec2 delta = vUv - uCenter;
      float dist = length(delta);
      float lensMask = (1.0 - smoothstep(uRadius - uSoftness, uRadius, dist)) * uEnabled;

      vec2 zoomUv = uCenter + delta / uZoom;
      zoomUv = clamp(zoomUv, vec2(0.0), vec2(1.0));

      vec4 baseColor = texture2D(tDiffuse, vUv);
      vec4 zoomColor = texture2D(tDiffuse, zoomUv);
      vec4 color = mix(baseColor, zoomColor, lensMask);

      // Gold ring around lens edge
      float ringOuter = smoothstep(uRadius + 0.006, uRadius, dist);
      float ringInner = smoothstep(uRadius, uRadius - 0.006, dist);
      float ring = max(ringOuter - ringInner, 0.0) * uEnabled;
      color.rgb = mix(color.rgb, vec3(0.98, 0.9, 0.72), ring * 0.45);

      gl_FragColor = color;
    }
  `,
  depthTest: false,
  depthWrite: false
});
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
postScene.add(postQuad);

// ─── Camera state ───
let orthoSize = 1.2;
let targetOrthoSize = 1.2;
const panOffset = new THREE.Vector2(0, 0);
const targetPanOffset = new THREE.Vector2(0, 0);
let defaultOrthoSize = 1.2;
let zoomedOutSize = 2.0;
const MIN_ZOOM = 0.3;
const MAX_ZOOM = 3.5;
let animatingCamera = false;

function updateCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  camera.left   = -orthoSize * aspect + panOffset.x;
  camera.right  =  orthoSize * aspect + panOffset.x;
  camera.top    =  orthoSize + panOffset.y;
  camera.bottom = -orthoSize + panOffset.y;
  camera.updateProjectionMatrix();
}
updateCamera();

function smoothCameraTo(size, px, py) {
  targetOrthoSize = size;
  targetPanOffset.set(px, py);
  animatingCamera = true;
}

// ─── Pointer pan ───
let pointerDown = false;
let lastPointer = { x: 0, y: 0 };
let pointerMoved = false;

renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "touch" && touchCount >= 2) return;
  pointerDown = true;
  pointerMoved = false;
  lastPointer.x = e.clientX;
  lastPointer.y = e.clientY;
});

renderer.domElement.addEventListener("pointermove", (e) => {
  if (!pointerDown) return;
  const dx = e.clientX - lastPointer.x;
  const dy = e.clientY - lastPointer.y;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) pointerMoved = true;
  const scale = (orthoSize * 2) / window.innerHeight;
  panOffset.x -= dx * scale;
  panOffset.y += dy * scale;
  targetPanOffset.copy(panOffset);
  targetOrthoSize = orthoSize;
  lastPointer.x = e.clientX;
  lastPointer.y = e.clientY;
  updateCamera();
});

renderer.domElement.addEventListener("pointerup", () => { pointerDown = false; });
renderer.domElement.addEventListener("pointercancel", () => { pointerDown = false; });

// ─── Pinch zoom (touch) ───
let touchCount = 0;
let lastPinchDist = 0;

renderer.domElement.addEventListener("touchstart", (e) => {
  touchCount = e.touches.length;
  if (touchCount === 2) {
    lastPinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

renderer.domElement.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const ratio = lastPinchDist / dist;
    orthoSize = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, orthoSize * ratio));
    targetOrthoSize = orthoSize;
    lastPinchDist = dist;
    updateCamera();
  }
}, { passive: true });

renderer.domElement.addEventListener("touchend", (e) => { touchCount = e.touches.length; });

// ─── Scroll zoom (mouse) ───
renderer.domElement.addEventListener("wheel", (e) => {
  e.preventDefault();
  orthoSize *= e.deltaY > 0 ? 1.08 : 0.93;
  orthoSize = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, orthoSize));
  targetOrthoSize = orthoSize;
  updateCamera();
}, { passive: false });

// ─── Flip ───
let showingFront = true;
let currentRotationY = 0;
let targetRotationY = 0;
let flipping = false;

const flipBtn = document.getElementById("flipBtn");
const sideLabel = document.getElementById("sideLabel");

flipBtn.addEventListener("click", () => {
  closeInfoCard();
  showingFront = !showingFront;
  targetRotationY = showingFront ? 0 : Math.PI;
  sideLabel.textContent = showingFront ? "Front" : "Back";
  flipping = true;
  builtSide = null;
  buildHotspots();
});

// ─── Load model ───
const loader = new GLTFLoader();
const MODEL_PATHS = ["../byzantine-medieval_papyrus.glb", "../byzantine-medieval_papyrus%20(1).glb"];
let model = null;
let modelBox = new THREE.Box3();
const papyrusHitMeshes = [];

function loadModelAt(idx) {
  if (idx >= MODEL_PATHS.length) {
    document.getElementById("status").textContent = "Model failed to load";
    return;
  }
  loader.load(
    MODEL_PATHS[idx],
    (gltf) => {
      model = gltf.scene;
      modelBox.setFromObject(model);
      const center = modelBox.getCenter(new THREE.Vector3());
      model.position.sub(center);
      modelBox.setFromObject(model);

      // Collect meshes for hand-tracking raycaster
      model.traverse((obj) => {
        if (obj.isMesh) papyrusHitMeshes.push(obj);
      });

      const size = new THREE.Vector3();
      modelBox.getSize(size);
      const aspect = window.innerWidth / window.innerHeight;
      const fitH = Math.max(size.y * 0.75, 0.8);
      const fitW = Math.max(size.x / (2 * Math.max(aspect, 0.5)) * 1.25, 0.8);
      defaultOrthoSize = Math.max(fitH, fitW);
      zoomedOutSize = defaultOrthoSize * 1.6;
      orthoSize = defaultOrthoSize;
      targetOrthoSize = defaultOrthoSize;
      panOffset.set(0, 0);
      targetPanOffset.set(0, 0);
      updateCamera();

      scene.add(model);
      document.getElementById("status").textContent = "Papyrus loaded";
      setTimeout(() => { document.getElementById("status").style.opacity = "0"; }, 2000);
      setTimeout(() => { document.getElementById("hint").style.opacity = "0"; }, 5000);
      buildHotspots();
    },
    undefined,
    () => loadModelAt(idx + 1)
  );
}
loadModelAt(0);

// ─── Project world → screen ───
function worldToScreen(nx, ny) {
  if (!model) return { x: -999, y: -999 };
  const size = new THREE.Vector3();
  modelBox.getSize(size);
  const min = modelBox.min;
  const ctr = modelBox.getCenter(new THREE.Vector3());

  const wp = new THREE.Vector3(
    min.x + nx * size.x,
    min.y + (1 - ny) * size.y,
    ctr.z
  );
  wp.applyMatrix4(model.matrixWorld);
  wp.project(camera);

  return {
    x: (wp.x * 0.5 + 0.5) * window.innerWidth,
    y: (-wp.y * 0.5 + 0.5) * window.innerHeight
  };
}

// ─── Hotspot markers ───
let hotspotEls = [];
let builtSide = null;
let driftData = [];

function buildHotspots() {
  const side = showingFront ? "front" : "back";
  if (side === builtSide) return;
  builtSide = side;

  hotspotEls.forEach(h => h.remove());
  hotspotEls = [];
  driftData = [];

  const visible = annotations.filter(a => a.side === side);
  visible.forEach((a, i) => {
    const el = document.createElement("div");
    el.className = "hotspot";
    el.textContent = a.num;
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      openInfoCard(a, i);
    });
    document.body.appendChild(el);
    hotspotEls.push(el);

    driftData.push({
      phaseX: Math.random() * Math.PI * 2,
      phaseY: Math.random() * Math.PI * 2,
      ampX: 2 + Math.random() * 4,
      ampY: 2 + Math.random() * 3,
      speedX: 0.3 + Math.random() * 0.5,
      speedY: 0.4 + Math.random() * 0.4
    });
  });

  positionHotspots();
}

function positionHotspots() {
  const side = showingFront ? "front" : "back";
  const visible = annotations.filter(a => a.side === side);
  const t = performance.now() / 1000;

  visible.forEach((a, i) => {
    const el = hotspotEls[i];
    if (!el) return;
    const pos = worldToScreen(a.anchorNorm[0], a.anchorNorm[1]);

    let dx = 0, dy = 0;
    if (!isMobile && driftData[i]) {
      const d = driftData[i];
      dx = Math.sin(t * d.speedX + d.phaseX) * d.ampX;
      dy = Math.cos(t * d.speedY + d.phaseY) * d.ampY;
    }

    el.style.left = (pos.x - 16 + dx) + "px";
    el.style.top  = (pos.y - 16 + dy) + "px";
  });
}

// ─── Info card logic ───
const infoCard = document.getElementById("infoCard");
const cardIcon = document.getElementById("cardIcon");
const cardTitle = document.getElementById("cardTitle");
const cardText = document.getElementById("cardText");
const cardClose = document.getElementById("cardClose");
const svgLayer = document.getElementById("annotationLayer");

let activeAnnotation = null;
let activeLine = null;
let activeDot = null;

function openInfoCard(a, hotspotIdx) {
  hotspotEls.forEach(h => h.classList.remove("active"));
  if (hotspotEls[hotspotIdx]) hotspotEls[hotspotIdx].classList.add("active");

  activeAnnotation = a;
  cardIcon.src = a.icon;
  cardIcon.alt = a.title;
  cardTitle.textContent = a.title;
  cardText.textContent = a.text;
  infoCard.style.display = "flex";
  requestAnimationFrame(() => infoCard.classList.add("visible"));

  smoothCameraTo(zoomedOutSize, 0, 0);

  clearLine();
  activeLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
  activeLine.setAttribute("stroke", "rgba(240,217,160,0.6)");
  activeLine.setAttribute("stroke-width", "1.5");
  svgLayer.appendChild(activeLine);

  activeDot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  activeDot.setAttribute("r", "4");
  activeDot.setAttribute("fill", "#f0d9a0");
  svgLayer.appendChild(activeDot);

  positionInfoCard();
}

function closeInfoCard() {
  infoCard.classList.remove("visible");
  setTimeout(() => { infoCard.style.display = "none"; }, 300);
  activeAnnotation = null;
  hotspotEls.forEach(h => h.classList.remove("active"));
  clearLine();
  smoothCameraTo(defaultOrthoSize, 0, 0);
}

function clearLine() {
  if (activeLine) { activeLine.remove(); activeLine = null; }
  if (activeDot)  { activeDot.remove();  activeDot = null;  }
}

function positionInfoCard() {
  if (!activeAnnotation) return;
  const a = activeAnnotation;
  const W = window.innerWidth;
  const H = window.innerHeight;
  const anchor = worldToScreen(a.anchorNorm[0], a.anchorNorm[1]);

  const CARD_W = 260;
  const MARGIN = 16;
  let cx, cy;

  if (a.cardSide === "left") {
    cx = MARGIN;
  } else {
    cx = W - CARD_W - MARGIN;
  }
  cy = Math.max(MARGIN, Math.min(H - 160, anchor.y - 40));

  infoCard.style.left = cx + "px";
  infoCard.style.top = cy + "px";

  if (activeLine && activeDot) {
    const lineEndX = a.cardSide === "left" ? cx + CARD_W : cx;
    const lineEndY = cy + 30;

    activeDot.setAttribute("cx", anchor.x);
    activeDot.setAttribute("cy", anchor.y);
    activeLine.setAttribute("x1", anchor.x);
    activeLine.setAttribute("y1", anchor.y);
    activeLine.setAttribute("x2", lineEndX);
    activeLine.setAttribute("y2", lineEndY);

    const len = Math.hypot(lineEndX - anchor.x, lineEndY - anchor.y);
    activeLine.setAttribute("stroke-dasharray", len);
    activeLine.setAttribute("stroke-dashoffset", len);
    activeLine.style.transition = "stroke-dashoffset 0.5s ease";
    requestAnimationFrame(() => {
      if (activeLine) activeLine.setAttribute("stroke-dashoffset", "0");
    });
  }
}

cardClose.addEventListener("click", (e) => { e.stopPropagation(); closeInfoCard(); });

renderer.domElement.addEventListener("click", () => {
  if (!pointerMoved && activeAnnotation) closeInfoCard();
});
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeInfoCard();
});

// ═══════════════════════════════════════════════════════════════
//  HAND TRACKING — Magnifying Glass Lens
// ═══════════════════════════════════════════════════════════════

const video = document.getElementById("cameraPreview");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const gestureLabelEl = document.getElementById("gestureLabel");

const raycaster = new THREE.Raycaster();
const handNdc = new THREE.Vector2(0, 0);

let handLandmarker = null;
let mediaStream = null;
let trackingActive = false;
let lastVideoTime = -1;

// ── Gesture helpers ──
function landmarkDistance(lm, a, b) {
  const dx = lm[a].x - lm[b].x;
  const dy = lm[a].y - lm[b].y;
  return Math.hypot(dx, dy);
}

function isFingerExtended(lm, tipIndex, pipIndex) {
  return lm[tipIndex].y < lm[pipIndex].y - 0.015;
}

function detectGestures(lm) {
  const pinchDistance = landmarkDistance(lm, 4, 8);
  const pinch = pinchDistance < 0.06;

  const indexExtended  = isFingerExtended(lm, 8, 6);
  const middleExtended = isFingerExtended(lm, 12, 10);
  const ringExtended   = isFingerExtended(lm, 16, 14);
  const pinkyExtended  = isFingerExtended(lm, 20, 18);

  const openPalm = indexExtended && middleExtended && ringExtended && pinkyExtended;
  const fist = !indexExtended && !middleExtended && !ringExtended && !pinkyExtended;

  return { pinch, pinchDistance, openPalm, fist };
}

// ── Setup MediaPipe ──
async function setupHandTracking() {
  if (handLandmarker) return handLandmarker;

  document.getElementById("status").style.opacity = "1";
  document.getElementById("status").textContent = "Loading hand tracker…";

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
    },
    runningMode: "VIDEO",
    numHands: 1
  });

  return handLandmarker;
}

// ── Start / Stop ──
async function startTracking() {
  if (trackingActive) return;

  try {
    await setupHandTracking();

    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });

    video.srcObject = mediaStream;
    video.style.display = "block";
    await video.play();

    trackingActive = true;
    revealLightTargetIntensity = 0.0;
    gestureLabelEl.classList.add("visible");

    document.getElementById("status").style.opacity = "1";
    document.getElementById("status").textContent = "Hand tracking active";
    setTimeout(() => { document.getElementById("status").style.opacity = "0"; }, 2000);
  } catch (error) {
    console.error(error);
    document.getElementById("status").style.opacity = "1";
    document.getElementById("status").textContent = "Camera/tracking failed — check permissions";
  }
}

function stopTracking() {
  trackingActive = false;
  lensVisible = false;
  postMaterial.uniforms.uEnabled.value = 0.0;
  freezeLens = false;
  gestureLabel = "none";
  wasPinch = false;
  revealLightTargetIntensity = 0.0;
  revealLight.intensity = 0.0;
  revealLight.visible = false;
  gestureLabelEl.classList.remove("visible");

  if (mediaStream) {
    mediaStream.getTracks().forEach((track) => track.stop());
    mediaStream = null;
  }

  video.srcObject = null;
  video.style.display = "none";

  document.getElementById("status").style.opacity = "1";
  document.getElementById("status").textContent = "Tracking stopped";
  setTimeout(() => { document.getElementById("status").style.opacity = "0"; }, 2000);
}

startBtn.addEventListener("click", startTracking);
stopBtn.addEventListener("click", stopTracking);

// ── Process each video frame ──
function updateHandPoint() {
  if (!trackingActive || !handLandmarker || video.readyState < 2) return;

  const now = performance.now();
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const result = handLandmarker.detectForVideo(video, now);
  const landmarks = result.landmarks?.[0];
  if (!landmarks) {
    lensVisible = false;
    revealLightTargetIntensity = 0.0;
    gestureLabel = "no hand";
    return;
  }

  const gestures = detectGestures(landmarks);

  // Pinch toggles freeze
  if (gestures.pinch && !wasPinch && now - lastFreezeToggle > 450) {
    freezeLens = !freezeLens;
    lastFreezeToggle = now;
  }
  wasPinch = gestures.pinch;

  // Gesture → lens radius
  if (gestures.openPalm) {
    lensRadiusTarget = 0.22;
    gestureLabel = "open palm — wide lens";
  } else if (gestures.fist) {
    lensRadiusTarget = 0.12;
    gestureLabel = "fist — small lens";
  } else {
    lensRadiusTarget = 0.17;
    gestureLabel = "point";
  }

  // Freeze logic
  if (freezeLens) {
    gestureLabel = gestures.pinch ? "freeze toggled" : "frozen (pinch to unfreeze)";
    lensVisible = true;
    // Keep the magnifier frozen but do not keep projecting extra scene light.
    revealLightTargetIntensity = 0.0;
    return;
  }

  // Fingertip → NDC → raycast onto papyrus
  const tip = landmarks[8];
  const mirroredX = 1 - tip.x;
  handNdc.set(mirroredX * 2 - 1, -(tip.y * 2 - 1));
  raycaster.setFromCamera(handNdc, camera);

  const intersects = raycaster.intersectObjects(papyrusHitMeshes, true);
  if (!intersects.length) {
    lensVisible = false;
    revealLightTargetIntensity = 0.0;
    gestureLabel = "hand off papyrus";
    return;
  }

  const hit = intersects[0];
  lensVisible = true;
  revealLightTargetIntensity = 0.9;
  if (gestures.pinch) gestureLabel = "freeze toggled";

  // Project hit point to screen UV for lens shader
  const projected = hit.point.clone().project(camera);
  lensTarget.set(
    THREE.MathUtils.clamp((projected.x + 1) * 0.5, 0, 1),
    THREE.MathUtils.clamp((projected.y + 1) * 0.5, 0, 1)
  );

  // Move reveal light to the hit surface
  tempNormal.copy(hit.face?.normal || new THREE.Vector3(0, 0, 1));
  tempNormal.transformDirection(hit.object.matrixWorld);

  tempLightPos.copy(hit.point).addScaledVector(tempNormal, 0.5);
  tempTargetPos.copy(hit.point).addScaledVector(tempNormal, 0.01);

  revealLight.position.lerp(tempLightPos, 0.28);
  revealLight.target.position.lerp(tempTargetPos, 0.28);
}

function updateRevealLight() {
  revealLight.intensity = THREE.MathUtils.lerp(revealLight.intensity, revealLightTargetIntensity, 0.2);
  revealLight.visible = revealLight.intensity > 0.01;
}

// ── Smooth lens uniforms ──
function updateLensUniforms() {
  if (!lensVisible) {
    postMaterial.uniforms.uEnabled.value *= 0.85; // smooth fade-out
    if (postMaterial.uniforms.uEnabled.value < 0.01) {
      postMaterial.uniforms.uEnabled.value = 0.0;
    }
    return;
  }

  lensCenter.lerp(lensTarget, 0.24);
  postMaterial.uniforms.uCenter.value.copy(lensCenter);
  postMaterial.uniforms.uRadius.value = THREE.MathUtils.lerp(
    postMaterial.uniforms.uRadius.value,
    lensRadiusTarget,
    0.2
  );
  postMaterial.uniforms.uZoom.value = THREE.MathUtils.lerp(
    postMaterial.uniforms.uZoom.value,
    lensZoomTarget,
    0.24
  );
  postMaterial.uniforms.uEnabled.value = THREE.MathUtils.lerp(
    postMaterial.uniforms.uEnabled.value,
    1.0,
    0.3
  );
}

// ─── Resize ───
window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.getDrawingBufferSize(drawingBufferSize);
  sceneTarget.setSize(drawingBufferSize.x, drawingBufferSize.y);
  updateCamera();
  positionHotspots();
  positionInfoCard();
});

window.addEventListener("beforeunload", stopTracking);

// ─── Animate ───
function animate() {
  requestAnimationFrame(animate);

  // Smooth flip
  if (model && flipping) {
    currentRotationY += (targetRotationY - currentRotationY) * 0.08;
    if (Math.abs(targetRotationY - currentRotationY) < 0.005) {
      currentRotationY = targetRotationY;
      flipping = false;
    }
    model.rotation.y = currentRotationY;
  }

  // Smooth camera zoom/pan
  if (animatingCamera) {
    orthoSize += (targetOrthoSize - orthoSize) * 0.08;
    panOffset.x += (targetPanOffset.x - panOffset.x) * 0.08;
    panOffset.y += (targetPanOffset.y - panOffset.y) * 0.08;
    if (Math.abs(targetOrthoSize - orthoSize) < 0.002
     && Math.abs(targetPanOffset.x - panOffset.x) < 0.002
     && Math.abs(targetPanOffset.y - panOffset.y) < 0.002) {
      orthoSize = targetOrthoSize;
      panOffset.copy(targetPanOffset);
      animatingCamera = false;
    }
    updateCamera();
  }

  // Hand tracking
  updateHandPoint();
  updateLensUniforms();
  updateRevealLight();

  if (trackingActive) {
    gestureLabelEl.textContent = gestureLabel;
  }

  // Only use 2-pass lens pipeline when the lens effect is visible;
  // otherwise render directly (avoids color-space darkening).
  const lensActive = postMaterial.uniforms.uEnabled.value > 0.005;
  if (lensActive) {
    renderer.setRenderTarget(sceneTarget);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCamera);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }

  positionHotspots();
  if (activeAnnotation) positionInfoCard();
}
animate();

</script>
